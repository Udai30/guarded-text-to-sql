name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlagent_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: adventureworks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlagent_owner -d adventureworks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: sqlagent_owner
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: adventureworks
      SQLAGENT_DB_HOST: localhost
      SQLAGENT_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: pg_isready -h localhost -p 5432 -U sqlagent_owner
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v
      - run: uv run sqlagent --help
